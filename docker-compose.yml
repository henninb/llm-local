name: llm-gateway

services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm
    restart: unless-stopped
    user: "1000:1000"  # Run as non-root user (matches Dockerfile USER)
    # ports:
    #   - "4000:4000"  # Port not exposed to host - only accessible within Docker network

    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN}
      - LITELLM_DROP_PARAMS=true
      - ENABLE_RATE_LIMIT=true

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      llm-gateway-network:
        aliases:
          - litellm

  openwebui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DATA_DIR=/app/backend/data
      - ENABLE_OLLAMA_API=false
      - USER_AGENT=OpenWebUI
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN}
      - ENABLE_EVALUATION_ARENA_MODELS=false
      - ENABLE_PERSISTENT_CONFIG=true
      - BYPASS_MODEL_ACCESS_CONTROL=true
    depends_on:
      - litellm
    networks:
      llm-gateway-network:
        aliases:
          - openwebui

networks:
  llm-gateway-network:
    name: llm-gateway-network
    driver: bridge

volumes:
  openwebui:
    name: openwebui-volume
